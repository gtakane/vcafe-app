name: vcafe-dashboard-ci

on:
  pull_request:
    paths:
      - "vcafe-dashboard/**"
      - ".github/workflows/vcafe-dashboard-ci.yml"
  push:
    branches:
      - "agent/nextjs-firebase-dashboard"
      - "claude/nextjs-firebase-dashboard-review-w74yfo"
    paths:
      - "vcafe-dashboard/**"
      - ".github/workflows/vcafe-dashboard-ci.yml"

permissions:
  contents: read

concurrency:
  group: vcafe-dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vcafe-dashboard
    env:
      AUTH_MODE: demo
      ANALYTICS_BACKEND: demo
      DEMO_ROLE: admin
      DEMO_MAID_ID: maid-01
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: vcafe-admin-analytics.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: vcafe-admin-analytics
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vcafe-dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Set up Python for the shared metrics contract
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tsconfig が services/tests を除外していたため、同期サービスの型エラーが
      # CI をすり抜けていた。型検査を明示的に実行する。
      - name: Typecheck (app + analytics sync)
        run: npm run typecheck

      - name: Test dashboard
        run: npm test

      - name: Test analytics sync safety
        run: npm test --prefix services/analytics-sync

      - name: Test Discord attendance parser
        run: npm test --prefix services/discord-attendance

      # Python(core.py) と TypeScript(lib/metrics.ts) が同じ golden fixture で
      # 同じ値を返すことを検証する。片方だけ変更すると落ちる。
      - name: Metrics contract (Python vs TypeScript)
        run: npm run test:contract

      # schema.sql から manifest を再生成し、コミット済みのものと差分が無いことを確認する。
      # 実 BigQuery との照合は services/analytics-sync/check-bigquery-schema.sh で行う
      # （認証情報が必要なため CI では別ジョブ／nightly に分離する）。
      - name: Schema manifest is up to date
        run: |
          npm run schema:manifest
          git diff --exit-code services/analytics-sync/src/schema-manifest.json \
            || { echo "::error::schema.sql と manifest がずれています。npm run schema:manifest を実行してコミットしてください"; exit 1; }

      - name: Build Next.js dashboard
        run: npm run build
