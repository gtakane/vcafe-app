# 予約通知ジョブの環境変数（Cloud Run Job 用）。
# 秘密情報（DISCORD_BOT_TOKEN）はここに書かず、deploy時に Secret Manager から注入する。
# まずは DRY_RUN=true（DMを送らずログのみ）で本番の予約を正しく拾えるか検証すること。

# --- 安全ガード ---
CONFIRM_READ_ONLY_PRODUCTION: "I_UNDERSTAND_THIS_READS_PRODUCTION"
PRODUCTION_PROJECT_ID: v-athome-cafe-app
MANAGEMENT_PROJECT_ID: vcafe-admin-analytics

# --- 実行モード ---
DRY_RUN: "true"            # 検証が済んだら "false" にして実送信
TARGET_OFFSET_DAYS: "0"    # 0=当日の営業日ぶんを通知
SHOW_CUSTOMER: "false"     # お客様名をDMに含めるか（運用判断）

# --- 予約データの取得元（本番スキーマ確認済み: workshiftGroups/{YYYYMMDD}/reservations） ---
# 対象営業日のグループ配下 reservations を直接読む（コレクショングループ索引が不要）。
# openTime=お給仕開始時刻、rsvStatus=true が「実際に予約が入った」枠（false=空き枠は通知しない）。
RESERVATION_PARENT_COLLECTION: workshiftGroups
RESERVATION_SUBCOLLECTION: reservations
RESERVATION_DATE_FIELD: openTime
RESERVATION_MAID_ID_FIELD: maidId
RESERVATION_MAID_NICKNAME_FIELD: maidNickname
RESERVATION_CUSTOMER_LABEL_FIELD: rsvUserNickname
RESERVATION_FILTER_FIELD: rsvStatus
RESERVATION_FILTER_VALUE: "true"

# --- メイド↔Discord 対応 ---
MAID_DISCORD_MAP_COLLECTION: maidDiscordMap
ATTENDANCE_FALLBACK: "true"

# --- Discord（DISCORD_BOT_TOKEN は Secret Manager から注入） ---
DISCORD_GUILD_ID: ""
