# Discord勤怠取り込みBotの環境変数（Cloud Run サービス用）。
# 秘密情報（DISCORD_BOT_TOKEN）はここに書かず、deploy時に Secret Manager から注入する。
# PRODUCTION_PROJECT_ID は安全ガードのため必須（本番プロジェクトを管理用に指定させない）。
MANAGEMENT_PROJECT_ID: vcafe-admin-analytics
PRODUCTION_PROJECT_ID: v-athome-cafe-app
# 対象チャンネル/ギルドは実値に置き換える。
DISCORD_CHANNEL_ID: "REPLACE_WITH_CHANNEL_ID"
DISCORD_GUILD_ID: "REPLACE_WITH_GUILD_ID"
